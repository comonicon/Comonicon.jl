name: CI
on:
  - push
  - pull_request
jobs:
  test:
    name: ${{ matrix.package }} - Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
          - '1.6'
          # - 'nightly'
        os:
          - ubuntu-latest
        arch:
          - x64
        package:
          - 'Comonicon'
          - 'lib'
          - 'example'
        include:
          - os: macOS-latest
            arch: aarch64
            version: '1'
            package: 'Comonicon'
          - os: macOS-latest
            arch: aarch64
            version: '1'
            package: 'lib'
          - os: macOS-latest
            arch: aarch64
            version: '1'
            package: 'example'
          - os: windows-latest
            version: '1'
            arch: x64
            package: 'Comonicon'
          - os: windows-latest
            version: '1'
            arch: x64
            package: 'lib'
          # - os: windows-latest
          #   version: '1'
          #   arch: x64
          #   package: 'example'
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - name: "add TestEnv"
        shell: julia --color=yes {0}
        run: |
          import Pkg; Pkg.add("TestEnv");
      - uses: julia-actions/julia-buildpkg@v1
      - name: "run test"
        run: julia --project .ci/test.jl runtest ${{ matrix.package }} --coverage
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
